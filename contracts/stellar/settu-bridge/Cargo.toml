[package]
name = "settu-bridge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Settu user bridge: verifies a Settu-signed quote, takes the fees and burns the rest through Circle CCTP V2."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "=23.5.3", features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { version = "=23.5.3", features = ["testutils", "hazmat-address"] }
ed25519-dalek = "=2.2.0"
hex = "0.4"
serde_json = "1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
