name: Sweep stranded offramp burns

# Manual fallback only. The every-5-minutes schedule now runs on an Upstash
# QStash schedule calling the same endpoint with the same bearer token:
# GitHub treats scheduled workflows as best-effort, and this one, set to
# every 5 minutes, was actually firing every few hours (confirmed 2026-09-28,
# when a stranded Solana burn sat unnoticed). Use "Run workflow" to trigger a
# sweep on demand, e.g. if QStash is down.
on:
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep-burns
        run: |
          curl -sf -X POST "https://www.settu.xyz/api/admin/offramp/sweep-burns" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_API_SECRET }}"
